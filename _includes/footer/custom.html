<script>
document.addEventListener("DOMContentLoaded", function () {
  var openers = document.querySelectorAll("[data-lightbox-open]");
  var body = document.body;
  var activeLightbox = null;
  var activeImage = null;
  var activeReset = null;
  var currentScale = 1;

  function applyZoom() {
    if (!activeImage) return;
    activeImage.style.width = Math.round(currentScale * 100) + "%";
    if (activeReset) {
      activeReset.textContent = Math.round(currentScale * 100) + "%";
    }
  }

  function resetZoom(lightbox) {
    currentScale = 1;
    activeImage = lightbox ? lightbox.querySelector(".pub-lightbox__img") : null;
    activeReset = lightbox ? lightbox.querySelector("[data-zoom-reset]") : null;
    applyZoom();
  }

  function closeLightbox() {
    if (!activeLightbox) return;
    activeLightbox.classList.remove("is-open");
    activeLightbox.setAttribute("aria-hidden", "true");
    body.classList.remove("pub-lightbox-open");
    resetZoom(null);
    activeLightbox = null;
  }

  openers.forEach(function (opener) {
    opener.addEventListener("click", function (event) {
      var targetId = opener.getAttribute("data-lightbox-open");
      var lightbox = document.getElementById(targetId);
      if (!lightbox) return;
      event.preventDefault();
      closeLightbox();
      lightbox.classList.add("is-open");
      lightbox.setAttribute("aria-hidden", "false");
      body.classList.add("pub-lightbox-open");
      activeLightbox = lightbox;
      resetZoom(lightbox);
    });
  });

  document.addEventListener("click", function (event) {
    if (!event.target.matches("[data-lightbox-close]")) return;
    closeLightbox();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeLightbox();
    }
  });

  document.addEventListener("click", function (event) {
    if (event.target.matches("[data-zoom-in]")) {
      currentScale = Math.min(currentScale + 0.25, 4);
      applyZoom();
      return;
    }

    if (event.target.matches("[data-zoom-out]")) {
      currentScale = Math.max(currentScale - 0.25, 0.75);
      applyZoom();
      return;
    }

    if (event.target.matches("[data-zoom-reset]")) {
      currentScale = 1;
      applyZoom();
    }
  });
});
</script>
