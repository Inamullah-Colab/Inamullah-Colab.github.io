<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-label="Unit circle and real/imaginary waves explanation">  
  <defs>    
    <style>      
      .bg { fill: #f8fafc; }      
      .grid { fill: none; stroke: #dbeafe; stroke-width: 1; }      
      .axis { stroke: #64748b; stroke-width: 2; }      
      .circle { fill: none; stroke: #0f172a; stroke-width: 4; opacity: 0.35; }      
      .wave-real { fill: none; stroke: #2563eb; stroke-width: 3; }      
      .wave-imag { fill: none; stroke: #9333ea; stroke-width: 3; stroke-dasharray: 12 8; }      
      .dot { fill: #0ea5e9; stroke: #fff; stroke-width: 3; }      
      .point { fill: #f97316; stroke: none; }      
      .label { fill: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; }      
      .title { fill: #111827; font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 700; }      
      .note { fill: #475569; font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; }    
    </style>  
  </defs>  
  <rect width="940" height="560" class="bg" rx="26"/>  
  <text x="470" y="38" text-anchor="middle" class="title">Euler’s Identity: Unit Circle &amp; Real / Imaginary Waves</text>  
  <g transform="translate(120, 120)">    
    <line x1="-10" y1="0" x2="300" y2="0" class="axis" />    
    <line x1="150" y1="-160" x2="150" y2="170" class="axis" />    
    <circle cx="150" cy="0" r="130" class="circle" />    
    <line x1="150" y1="0" x2="30" y2="-112" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />    
    <circle cx="30" cy="-112" r="10" class="dot">      
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">        
        <mpath xlink:href="#circlePath" />      
    </animateMotion>    
    </circle>    
    <path id="circlePath" d="M280,0 A130,130 0 1,0 20,0 A130,130 0 1,0 280,0" fill="none" />    
    <circle cx="150" cy="0" r="4" fill="#184e77" />    
    <circle cx="30" cy="-112" r="7" fill="#ef4444" />    
    <line x1="150" y1="0" x2="150" y2="-160" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />    
    <line x1="150" y1="0" x2="10" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />    
    <text x="296" y="-8" class="note">real axis</text>    
    <text x="154" y="-168" class="note">imaginary axis</text>    
    <text x="150" y="-80" class="label">e^{iθ}</text>    
    <text x="44" y="-118" class="label">point on circle</text>    
    <text x="150" y="-144" class="note" text-anchor="middle">rotation = multiplication by i</text>  
  </g>  
  <g transform="translate(460, 140)">    
    <rect x="0" y="0" width="420" height="260" fill="#ffffff" rx="18" stroke="#cbd5e1" stroke-width="1.8" />    
    <line x1="0" y1="130" x2="420" y2="130" class="axis" />    
    <line x1="42" y1="0" x2="42" y2="260" class="axis" />    
    <path class="wave-real" d="M42 130 C 95 60 135 200 187 130 S 279 60 332 130 S 424 200 475 130" transform="translate(0,-10)" />    
    <path class="wave-imag" d="M42 130 C 95 200 135 60 187 130 S 279 200 332 130 S 424 60 475 130" transform="translate(0,-10)" />    
    <circle cx="42" cy="130" r="6" fill="#0ea5e9" />    <circle cx="132" cy="130" r="6" fill="#9333ea" />    
    <circle cx="242" cy="128" r="6" fill="#0ea5e9" />    <circle cx="358" cy="132" r="6" fill="#9333ea" />    
    <text x="14" y="150" class="note">θ</text>    
    <text x="210" y="30" class="label">real part = cos(θ)</text>    
    <text x="210" y="55" class="label">imaginary part = sin(θ)</text>    
    <text x="210" y="245" class="note" text-anchor="middle">the same rotation appears as waves</text>  
  </g>  
  <g transform="translate(120, 410)">    
    <text x="0" y="0" class="label">In Euler’s formula, the circular motion on the unit circle</text>    
    <text x="0" y="24" class="label">is exactly the same motion that creates the cosine and sine waves.</text>  
  </g>  
  <g transform="translate(460, 430)">    
      <text class="note">Animated dot shows how a point on the circle moves while the real and imaginary values</text>      
      <text y="22" class="note">trace two waves on the graph: one for the real axis and one for the imaginary axis.</text>    
  </g></svg>