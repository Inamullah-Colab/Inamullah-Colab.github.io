<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Unit circle interpretation of Euler's formula</title>
  <desc id="desc">A point on the unit circle labeled e to the i theta at angle theta in the complex plane.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d7dde5; stroke-width: 1.5; rx: 16; }
    .title { font: 700 18px system-ui, sans-serif; fill: #17202a; }
    .label { font: 15px system-ui, sans-serif; fill: #2c3e50; }
    .soft { font: 13px system-ui, sans-serif; fill: #576574; }
    .axis { stroke: #2d3436; stroke-width: 1.8; }
    .circle { fill: none; stroke: #1f4e79; stroke-width: 3.5; }
    .radius { stroke: #c0392b; stroke-width: 4; stroke-linecap: round; }
    .guide { stroke: #95a5a6; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .point { fill: #c0392b; }
    .theta { font: italic 16px serif; fill: #c0392b; }
  </style>

  <rect class="panel" x="10" y="10" width="740" height="300" />
  <text class="title" x="215" y="42">Euler's Formula on the Complex Plane</text>

  <line class="axis" x1="120" y1="170" x2="520" y2="170" />
  <line class="axis" x1="320" y1="70" x2="320" y2="270" />
  <circle class="circle" cx="320" cy="170" r="92" />

  <line class="radius" x1="320" y1="170" x2="395" y2="116" />
  <line class="guide" x1="395" y1="116" x2="395" y2="170" />
  <line class="guide" x1="320" y1="170" x2="395" y2="170" />
  <circle class="point" cx="395" cy="116" r="7" />

  <path d="M356 170 A36 36 0 0 1 372 141" fill="none" stroke="#c0392b" stroke-width="2.5" />
  <text class="theta" x="364" y="158">theta</text>
  <text class="label" x="404" y="110">z = e^(i theta)</text>
  <text class="soft" x="402" y="129">= cos(theta) + i sin(theta)</text>

  <text class="label" x="528" y="175">Re(z)</text>
  <text class="label" x="328" y="62">Im(z)</text>
  <text class="label" x="306" y="189">0</text>
  <text class="label" x="407" y="189">1</text>
  <text class="label" x="218" y="189">-1</text>
  <text class="soft" x="188" y="286">When theta = pi, the point moves to -1 on the unit circle.</text>
</svg>
