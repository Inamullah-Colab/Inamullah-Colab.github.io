<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">From school mathematics to modern systems</title>
  <desc id="desc">A visual diagram showing the unit circle with pi-based angles, a trigonometric triangle, a bridge from classical mathematics and physics to probability, machine learning, deep learning, ChatGPT, social systems, and medical applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef6f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16345b"/>
      <stop offset="100%" stop-color="#1e7f7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#143154" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Georgia, 'Times New Roman', serif; fill: #11263f; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #38506c; }
      .section { font: 700 24px Georgia, 'Times New Roman', serif; fill: #16345b; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #16345b; }
      .text { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #24384f; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #3a536f; }
      .box-title { font: 700 18px Georgia, 'Times New Roman', serif; fill: #17304d; }
      .box-text { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #2a425b; }
      .chip { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #16345b; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>

  <rect x="42" y="34" width="1516" height="120" rx="30" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="88" y="85" class="title" fill="#ffffff">From formulas I once memorised to systems I now work with</text>
  <text x="88" y="122" class="subtitle" fill="#e7f1fb">Unit circle geometry, trigonometric ratios, linearisation, vector calculus, probability, machine learning, deep learning, foundation models, and real-world impact.</text>

  <rect x="52" y="180" width="650" height="565" rx="28" fill="#ffffff" stroke="#d7e6f2" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="225" class="section">1. Geometry and Trigonometry</text>
  <text x="82" y="255" class="text">The unit circle makes angles, coordinates, and periodicity visible instead of purely symbolic.</text>

  <!-- Unit circle -->
  <g transform="translate(0,0)">
    <line x1="315" y1="525" x2="315" y2="300" stroke="#a7bfd5" stroke-width="2"/>
    <line x1="190" y1="412" x2="440" y2="412" stroke="#a7bfd5" stroke-width="2"/>
    <circle cx="315" cy="412" r="112" fill="none" stroke="#1e7f7a" stroke-width="4"/>
    <line x1="315" y1="412" x2="394" y2="333" stroke="#16345b" stroke-width="4"/>
    <line x1="394" y1="412" x2="394" y2="333" stroke="#f28c28" stroke-width="3"/>
    <line x1="315" y1="412" x2="394" y2="412" stroke="#4b92db" stroke-width="3"/>
    <path d="M355 412 A40 40 0 0 1 344 384" fill="none" stroke="#b35b9f" stroke-width="3"/>
    <text x="348" y="392" class="label">θ</text>
    <text x="352" y="429" class="label" fill="#4b92db">cos θ</text>
    <text x="402" y="374" class="label" fill="#f28c28">sin θ</text>
    <text x="353" y="356" class="label">tan θ = sin θ / cos θ</text>
    <text x="302" y="285" class="label">π/2</text>
    <text x="445" y="418" class="label">0</text>
    <text x="296" y="555" class="label">3π/2</text>
    <text x="175" y="418" class="label">π</text>
    <text x="430" y="555" class="label">2π</text>
    <circle cx="394" cy="333" r="6" fill="#16345b"/>
    <text x="402" y="328" class="small">(cos θ, sin θ)</text>
    <text x="232" y="585" class="text">Identity: sin²θ + cos²θ = 1</text>
  </g>

  <!-- triangle formulas -->
  <rect x="492" y="305" width="175" height="160" rx="18" fill="#f8fbfe" stroke="#dce9f4"/>
  <text x="510" y="335" class="box-title">Right-triangle view</text>
  <text x="510" y="365" class="box-text">sin θ = opposite / hypotenuse</text>
  <text x="510" y="392" class="box-text">cos θ = adjacent / hypotenuse</text>
  <text x="510" y="419" class="box-text">tan θ = opposite / adjacent</text>
  <text x="510" y="453" class="small">These ratios are scale-stable.</text>

  <rect x="492" y="485" width="175" height="205" rx="18" fill="#f8fbfe" stroke="#dce9f4"/>
  <text x="510" y="515" class="box-title">What this supports</text>
  <text x="510" y="545" class="box-text">• Rotation matrices</text>
  <text x="510" y="572" class="box-text">• Waves and frequency</text>
  <text x="510" y="599" class="box-text">• Fourier intuition</text>
  <text x="510" y="626" class="box-text">• Coordinates and pose</text>
  <text x="510" y="653" class="box-text">• Geometry in imaging</text>

  <rect x="738" y="180" width="810" height="565" rx="28" fill="#ffffff" stroke="#d7e6f2" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="225" class="section">2. From theory to modern systems</text>
  <text x="770" y="255" class="text">The same mathematics extends from physical modelling to inference, learning, and high-impact applications.</text>

  <!-- pipeline boxes -->
  <g>
    <rect x="770" y="292" width="170" height="108" rx="22" fill="#edf5ff" stroke="#cddff7"/>
    <text x="790" y="323" class="box-title">Classical maths</text>
    <text x="790" y="350" class="box-text">vectors, matrices,</text>
    <text x="790" y="373" class="box-text">gradients, Laplacians</text>

    <rect x="972" y="292" width="170" height="108" rx="22" fill="#eef9f6" stroke="#cde9de"/>
    <text x="992" y="323" class="box-title">Classical physics</text>
    <text x="992" y="350" class="box-text">waves, fields,</text>
    <text x="992" y="373" class="box-text">curl, divergence</text>

    <rect x="1174" y="292" width="170" height="108" rx="22" fill="#fff7ea" stroke="#f1dcc1"/>
    <text x="1194" y="323" class="box-title">Probability</text>
    <text x="1194" y="350" class="box-text">uncertainty,</text>
    <text x="1194" y="373" class="box-text">noise, inference</text>

    <rect x="1376" y="292" width="140" height="108" rx="22" fill="#f7eefb" stroke="#e3d0ed"/>
    <text x="1395" y="323" class="box-title">Machine</text>
    <text x="1395" y="348" class="box-title">learning</text>
    <text x="1395" y="373" class="box-text">optimisation,</text>
    <text x="1395" y="394" class="box-text">generalisation</text>

    <line x1="940" y1="346" x2="972" y2="346" stroke="#88a4bc" stroke-width="4"/>
    <polygon points="972,346 958,338 958,354" fill="#88a4bc"/>
    <line x1="1142" y1="346" x2="1174" y2="346" stroke="#88a4bc" stroke-width="4"/>
    <polygon points="1174,346 1160,338 1160,354" fill="#88a4bc"/>
    <line x1="1344" y1="346" x2="1376" y2="346" stroke="#88a4bc" stroke-width="4"/>
    <polygon points="1376,346 1362,338 1362,354" fill="#88a4bc"/>
  </g>

  <g>
    <rect x="820" y="448" width="200" height="120" rx="22" fill="#f0f6ff" stroke="#d4e2f7"/>
    <text x="842" y="482" class="box-title">Deep learning</text>
    <text x="842" y="510" class="box-text">nonlinear models built</text>
    <text x="842" y="533" class="box-text">from linear layers plus</text>
    <text x="842" y="556" class="box-text">activations and gradients</text>

    <rect x="1050" y="448" width="210" height="120" rx="22" fill="#eef9f6" stroke="#cfe9df"/>
    <text x="1072" y="482" class="box-title">Foundation models</text>
    <text x="1072" y="510" class="box-text">transformers, embeddings,</text>
    <text x="1072" y="533" class="box-text">attention, ChatGPT-style</text>
    <text x="1072" y="556" class="box-text">sequence modelling</text>

    <rect x="1290" y="448" width="210" height="120" rx="22" fill="#fff6ec" stroke="#f0ddc8"/>
    <text x="1312" y="482" class="box-title">Social and medical impact</text>
    <text x="1312" y="510" class="box-text">decision support,</text>
    <text x="1312" y="533" class="box-text">public systems, imaging,</text>
    <text x="1312" y="556" class="box-text">biomarkers, healthcare</text>

    <line x1="1020" y1="508" x2="1050" y2="508" stroke="#88a4bc" stroke-width="4"/>
    <polygon points="1050,508 1036,500 1036,516" fill="#88a4bc"/>
    <line x1="1260" y1="508" x2="1290" y2="508" stroke="#88a4bc" stroke-width="4"/>
    <polygon points="1290,508 1276,500 1276,516" fill="#88a4bc"/>
  </g>

  <rect x="780" y="614" width="732" height="98" rx="22" fill="#f9fbfd" stroke="#d7e6f2"/>
  <text x="805" y="646" class="box-title">3. What changed in perspective</text>
  <text x="805" y="676" class="box-text">Theory -> assumptions -> hypotheses -> theorem/proof -> simulation -> implementation -> real-world decision making.</text>
  <text x="805" y="700" class="box-text">Many nonlinear systems are analysed by local linearisation, controlled approximation, and probabilistic reasoning.</text>

  <rect x="52" y="770" width="1496" height="150" rx="30" fill="#ffffff" stroke="#d7e6f2" stroke-width="2" filter="url(#shadow)"/>
  <text x="86" y="815" class="section">4. A broader mathematical lens</text>
  <text x="86" y="848" class="text">From scalar functions and vector fields to curl, divergence, gradients, and Laplacians, the same formulations help us model flow, change, structure, instability, entropy, and control.</text>
  <text x="86" y="876" class="text">What once looked like school-time abstraction later becomes the practical toolkit for reducing complexity, testing mechanisms, and building systems that work in both simulated and real settings.</text>
</svg>
