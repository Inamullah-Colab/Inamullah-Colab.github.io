<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc">
  <title id="title">From school formulas to modern systems</title>
  <desc id="desc">An academic visual showing the unit circle, right-triangle trigonometry, a chain from classical mathematics to physics, probability, machine learning, deep learning, language models, and social and medical applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#edf6f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12365f"/>
      <stop offset="100%" stop-color="#197d78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#153352" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7d96ad"/>
    </marker>
    <style>
      .hero-title { font: 700 42px Georgia, 'Times New Roman', serif; fill: #ffffff; }
      .hero-sub { font: 400 19px 'Segoe UI', Arial, sans-serif; fill: #e8f3fb; }
      .section { font: 700 30px Georgia, 'Times New Roman', serif; fill: #16345b; }
      .body { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #2a425b; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #43607c; }
      .tiny { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #56718a; }
      .box-title { font: 700 20px Georgia, 'Times New Roman', serif; fill: #17304d; }
      .box-text { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #29415b; }
      .math { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #17304d; }
      .chip { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #17304d; }
      .angle { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #8a3d8d; }
    </style>
  </defs>

  <rect width="1680" height="1180" fill="url(#bg)"/>

  <rect x="42" y="34" width="1596" height="138" rx="34" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="86" y="95" class="hero-title">From formulas I once memorised to systems I now work with</text>
  <text x="86" y="132" class="hero-sub">Unit-circle geometry, trigonometric ratios, linearisation, vector calculus, probability, machine learning, deep learning, language models, and real-world scientific use.</text>

  <rect x="48" y="206" width="650" height="580" rx="28" fill="#ffffff" stroke="#d4e4f2" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="252" class="section">1. Unit-circle intuition</text>
  <text x="80" y="284" class="body">The same picture explains coordinates, angles, periodicity, and rotation.</text>

  <!-- unit circle block -->
  <g>
    <line x1="286" y1="576" x2="286" y2="316" stroke="#b0c6d8" stroke-width="2"/>
    <line x1="136" y1="446" x2="436" y2="446" stroke="#b0c6d8" stroke-width="2"/>
    <circle cx="286" cy="446" r="130" fill="none" stroke="#197d78" stroke-width="5"/>

    <line x1="286" y1="446" x2="396" y2="382" stroke="#17304d" stroke-width="5"/>
    <line x1="396" y1="446" x2="396" y2="382" stroke="#f28a28" stroke-width="4"/>
    <line x1="286" y1="446" x2="396" y2="446" stroke="#4b8fdf" stroke-width="4"/>
    <path d="M338 446 A52 52 0 0 1 330 418" fill="none" stroke="#b251a5" stroke-width="4"/>

    <text x="333" y="421" class="angle">theta</text>
    <text x="338" y="469" class="math" fill="#4b8fdf">cos(theta)</text>
    <text x="406" y="419" class="math" fill="#f28a28">sin(theta)</text>
    <text x="404" y="390" class="small">(cos(theta), sin(theta))</text>

    <text x="278" y="296" class="math">pi/2</text>
    <text x="446" y="452" class="math">0</text>
    <text x="123" y="452" class="math">pi</text>
    <text x="268" y="610" class="math">3pi/2</text>
    <text x="448" y="610" class="math">2pi</text>

    <circle cx="286" cy="316" r="5" fill="#197d78"/>
    <circle cx="156" cy="446" r="5" fill="#197d78"/>
    <circle cx="416" cy="446" r="5" fill="#197d78"/>
    <circle cx="286" cy="576" r="5" fill="#197d78"/>
    <circle cx="396" cy="382" r="7" fill="#17304d"/>

    <text x="180" y="640" class="body">Identity: sin^2(theta) + cos^2(theta) = 1</text>
  </g>

  <!-- side cards -->
  <rect x="470" y="324" width="190" height="176" rx="20" fill="#f8fbfe" stroke="#d8e5f1"/>
  <text x="492" y="358" class="box-title">Right-triangle ratios</text>
  <text x="492" y="391" class="box-text">sin(theta) = opposite / hypotenuse</text>
  <text x="492" y="421" class="box-text">cos(theta) = adjacent / hypotenuse</text>
  <text x="492" y="451" class="box-text">tan(theta) = opposite / adjacent</text>
  <text x="492" y="481" class="small">Scale changes do not alter the ratios.</text>

  <rect x="470" y="524" width="190" height="224" rx="20" fill="#f8fbfe" stroke="#d8e5f1"/>
  <text x="492" y="558" class="box-title">What this picture gives</text>
  <text x="492" y="590" class="box-text">- rotation matrices</text>
  <text x="492" y="618" class="box-text">- phase and periodicity</text>
  <text x="492" y="646" class="box-text">- wave representation</text>
  <text x="492" y="674" class="box-text">- Fourier intuition</text>
  <text x="492" y="702" class="box-text">- image and signal geometry</text>

  <rect x="724" y="206" width="910" height="580" rx="28" fill="#ffffff" stroke="#d4e4f2" stroke-width="2" filter="url(#shadow)"/>
  <text x="758" y="252" class="section">2. How the mathematical chain grows</text>
  <text x="758" y="284" class="body">Theoretical ideas become operational when they are used to model, simplify, infer, optimise, and implement.</text>

  <!-- top pipeline -->
  <rect x="758" y="330" width="178" height="116" rx="22" fill="#eef5ff" stroke="#cfdef1"/>
  <text x="780" y="365" class="box-title">Classical mathematics</text>
  <text x="780" y="395" class="box-text">vectors, matrices,</text>
  <text x="780" y="420" class="box-text">gradients, operators</text>

  <rect x="972" y="330" width="178" height="116" rx="22" fill="#eef9f6" stroke="#d0e8df"/>
  <text x="995" y="365" class="box-title">Classical physics</text>
  <text x="995" y="395" class="box-text">waves, fields, flow,</text>
  <text x="995" y="420" class="box-text">curl, divergence</text>

  <rect x="1186" y="330" width="178" height="116" rx="22" fill="#fff7ea" stroke="#f0debe"/>
  <text x="1212" y="365" class="box-title">Probability</text>
  <text x="1212" y="395" class="box-text">noise, uncertainty,</text>
  <text x="1212" y="420" class="box-text">likelihood, inference</text>

  <rect x="1400" y="330" width="190" height="116" rx="22" fill="#f7effc" stroke="#e1d0ee"/>
  <text x="1424" y="365" class="box-title">Machine learning</text>
  <text x="1424" y="395" class="box-text">losses, gradients,</text>
  <text x="1424" y="420" class="box-text">generalisation</text>

  <line x1="936" y1="388" x2="972" y2="388" stroke="#7d96ad" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1150" y1="388" x2="1186" y2="388" stroke="#7d96ad" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1364" y1="388" x2="1400" y2="388" stroke="#7d96ad" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- lower pipeline -->
  <rect x="816" y="505" width="214" height="132" rx="22" fill="#eff4ff" stroke="#d3dff3"/>
  <text x="842" y="541" class="box-title">Deep learning</text>
  <text x="842" y="571" class="box-text">nonlinear models built from</text>
  <text x="842" y="596" class="box-text">linear maps, activations,</text>
  <text x="842" y="621" class="box-text">and optimisation</text>

  <rect x="1082" y="505" width="236" height="132" rx="22" fill="#eef8f5" stroke="#cfe7dc"/>
  <text x="1108" y="541" class="box-title">Language and foundation models</text>
  <text x="1108" y="571" class="box-text">embeddings, attention,</text>
  <text x="1108" y="596" class="box-text">sequence prediction,</text>
  <text x="1108" y="621" class="box-text">ChatGPT-style systems</text>

  <rect x="1370" y="505" width="220" height="132" rx="22" fill="#fff5ec" stroke="#efdaca"/>
  <text x="1394" y="541" class="box-title">Applications</text>
  <text x="1394" y="571" class="box-text">social systems, imaging,</text>
  <text x="1394" y="596" class="box-text">biomarkers, healthcare,</text>
  <text x="1394" y="621" class="box-text">decision support</text>

  <line x1="1030" y1="571" x2="1082" y2="571" stroke="#7d96ad" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1318" y1="571" x2="1370" y2="571" stroke="#7d96ad" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="760" y="674" width="830" height="82" rx="18" fill="#f9fbfd" stroke="#d6e5f2"/>
  <text x="786" y="708" class="box-title">A practical research path</text>
  <text x="786" y="735" class="box-text">assumptions -> hypotheses -> theorem/proof -> simulation -> optimisation -> implementation -> real-world judgement</text>

  <rect x="48" y="826" width="1586" height="306" rx="28" fill="#ffffff" stroke="#d4e4f2" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="872" class="section">3. The broader mathematical lens</text>
  <text x="82" y="906" class="body">The same formulations that look abstract in school later become tools for simplification, approximation, stability analysis, and mechanism-building.</text>

  <rect x="82" y="938" width="318" height="150" rx="20" fill="#eef5ff" stroke="#cfdef1"/>
  <text x="106" y="972" class="box-title">Reduction and linearisation</text>
  <text x="106" y="1000" class="box-text">Complicated nonlinear systems are</text>
  <text x="106" y="1024" class="box-text">often studied through local linear</text>
  <text x="106" y="1048" class="box-text">approximations and controlled simplification.</text>

  <rect x="430" y="938" width="318" height="150" rx="20" fill="#eef9f6" stroke="#cfe7dc"/>
  <text x="454" y="972" class="box-title">Vector calculus and fields</text>
  <text x="454" y="1000" class="box-text">Gradient, divergence, curl, and the</text>
  <text x="454" y="1024" class="box-text">Laplacian help describe flow, diffusion,</text>
  <text x="454" y="1048" class="box-text">accumulation, and propagation.</text>

  <rect x="778" y="938" width="318" height="150" rx="20" fill="#fff7ea" stroke="#f0debe"/>
  <text x="802" y="972" class="box-title">Uncertainty and entropy</text>
  <text x="802" y="1000" class="box-text">Probabilistic reasoning helps when</text>
  <text x="802" y="1024" class="box-text">data are noisy, partial, or stochastic,</text>
  <text x="802" y="1048" class="box-text">and when behaviour is unstable.</text>

  <rect x="1126" y="938" width="474" height="150" rx="20" fill="#f7eefb" stroke="#e1d0ee"/>
  <text x="1152" y="972" class="box-title">Why this matters</text>
  <text x="1152" y="1000" class="box-text">What once looked like disconnected formulas later becomes a toolkit for modelling, proving, simulating, and deploying systems that work in both synthetic and real-world settings.</text>
  <text x="1152" y="1036" class="box-text">That is why old mathematical foundations reappear in scientific AI, quantitative reasoning, and translational applications.</text>
</svg>
