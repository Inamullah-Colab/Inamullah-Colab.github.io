<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Euler's Identity diagram">  
  <defs>    
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">      
      <stop offset="0%" stop-color="#1d4ed8" />      
      <stop offset="100%" stop-color="#0ea5e9" />    
    </linearGradient>    
    <style>      
      .background { fill: #f8fafc; }      
      .circle { fill: none; stroke: #2563eb; stroke-width: 10; opacity: 0.16; }      
      .core { fill: #111827; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }      
      .node { fill: #ffffff; stroke: #1d4ed8; stroke-width: 5; }      
      .label { fill: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; font-weight: 600; }      
      .text-small { fill: #334155; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; }      
      .arc { fill: none; stroke: #0ea5e9; stroke-width: 5; stroke-linecap: round; }    
    </style>  
  </defs>  
  <rect width="900" height="620" class="background" rx="30"/>  
  <circle class="circle" cx="450" cy="310" r="210" />  
  <path class="arc" d="M660 310 A210 210 0 0 1 241 315" />  
  <path class="arc" stroke-dasharray="12 10" d="M560 115 A210 210 0 0 1 714 314" />  
  <circle class="node" cx="680" cy="310" r="38" />  
  <circle class="node" cx="450" cy="95" r="38" />  
  <circle class="node" cx="220" cy="310" r="38" />  
  <circle class="node" cx="516" cy="462" r="38" />  
  <circle class="node" cx="384" cy="462" r="38" />  
  <text x="450" y="275" text-anchor="middle" class="core" font-size="40">e^{iπ} + 1 = 0</text>  
  <text x="450" y="325" text-anchor="middle" class="text-small">One elegant bridge</text>  
  <text x="680" y="316" text-anchor="middle" class="label">1</text>  
  <text x="450" y="100" text-anchor="middle" class="label">π</text>  
  <text x="220" y="316" text-anchor="middle" class="label">0</text>  
  <text x="523" y="468" text-anchor="middle" class="label">e</text>  
  <text x="390" y="468" text-anchor="middle" class="label">i</text>  
  <text x="662" y="220" class="text-small">start</text>  
  <text x="410" y="134" class="text-small">half-turn</text>  
  <text x="238" y="220" class="text-small">balance</text>  
  <text x="608" y="516" class="text-small">engine</text>  
  <text x="360" y="516" class="text-small">steering</text>  
  <g transform="translate(335, 228)">    
    <path d="M0 -10 L-18 -22 L-18 2 Z" fill="#0ea5e9" transform="rotate(5)"/>  
  </g>  
  <g transform="translate(530, 215)">    
    <path d="M0 -10 L-18 -22 L-18 2 Z" fill="#0ea5e9" transform="rotate(-122)"/>  
  </g>  
</svg>
