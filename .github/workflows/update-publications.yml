name: Update Publications Data

on:
  push:
    branches:
      - master
    paths:
      - "markdown_generator/publications.tsv"
      - "scripts/update_publications_data.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Generate publications data
        run: python scripts/update_publications_data.py

      - name: Detect changes
        id: detect_changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No publication data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "Auto-update publications data"
          git push

      - name: Configure Pages
        if: steps.detect_changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        if: steps.detect_changes.outputs.changed == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        if: steps.detect_changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        if: steps.detect_changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
