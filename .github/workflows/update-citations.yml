name: Update Citation Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/update_citations_openalex.py"
      - "scripts/test_update_citations_openalex.py"
      - ".github/workflows/update-citations.yml"

concurrency:
  group: citation-updates
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect_changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Test citation updater
        run: python -m unittest discover -s scripts -p 'test_update_citations_openalex.py'

      - name: Update citations from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_citations_openalex.py


      - name: Detect changes
        id: detect_changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No citation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          git commit -m "Auto-update citation statistics"
          git push

      - name: Configure Pages
        if: steps.detect_changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        if: steps.detect_changes.outputs.changed == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        if: steps.detect_changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        if: steps.detect_changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
